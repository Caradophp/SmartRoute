databaseChangeLog:
  - include:
      file: db/changelog/00-create-initial-tables.sql
  - include:
      file: db/changelog/01-create-another-tables.sql
  - changeSet:
      id: 1
      author: nome
      changes:
        - createTable:
            tableName: exemplo
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
