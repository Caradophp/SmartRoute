spring:
  application:
    name: smartRoute
  datasource:
    url: ${DATABASE_URL}
    username: ${USERNAME}
    password: ${PASSWORD}
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  jpa: 
    hibernate.ddl-auto: validate
    show-sql: true
    properties:
      hibernate: 
        format_sql: true

config:
  email:
    host: smtp.gmail.com
    port: 587
    username: ${USERNAME_EMAIL}
    password: ${PASSWORD_EMAIL}
  jwt:
    secret-key: ${SECRECT_KEY}