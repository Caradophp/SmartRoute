<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartRoute - Meu Perfil</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 min-h-screen">
    <nav class="bg-blue-600 text-white p-4 shadow-md">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold"><i class="fas fa-route mr-2"></i>SmartRoute</h1>
            <div class="space-x-4">
                <a href="rotas.html" class="hover:underline">Minhas Rotas</a>
                <button onclick="logout()" class="bg-blue-700 px-3 py-1 rounded hover:bg-blue-800 transition">Sair</button>
            </div>
        </div>
    </nav>

    <div class="container mx-auto p-6 max-w-2xl">
        <div class="bg-white p-8 rounded-lg shadow-md">
            <div class="text-center mb-8">
                <div class="w-24 h-24 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center mx-auto mb-4">
                    <i class="fas fa-user text-4xl"></i>
                </div>
                <h2 class="text-2xl font-bold text-gray-800">Meu Perfil</h2>
                <p class="text-gray-500">Gerencie suas informações pessoais</p>
            </div>

            <form id="profileForm" class="space-y-6">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Nome Completo</label>
                        <input type="text" id="userName" class="w-full p-2 border rounded-md focus:ring-blue-500 focus:border-blue-500" placeholder="Seu nome">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">E-mail</label>
                        <input type="email" id="userEmail" disabled class="w-full p-2 border rounded-md bg-gray-100 cursor-not-allowed" placeholder="email@exemplo.com">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">CPF</label>
                        <input type="text" id="userCpf" class="w-full p-2 border rounded-md focus:ring-blue-500 focus:border-blue-500" placeholder="000.000.000-00">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Telefone</label>
                        <input type="text" id="userPhone" class="w-full p-2 border rounded-md focus:ring-blue-500 focus:border-blue-500" placeholder="(00) 00000-0000">
                    </div>
                </div>

                <div class="border-t pt-6 mt-6">
                    <h3 class="text-lg font-semibold mb-4 text-gray-700">Alterar Senha</h3>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <input type="password" id="newPass" class="p-2 border rounded-md" placeholder="Nova Senha">
                        <input type="password" id="confirmPass" class="p-2 border rounded-md" placeholder="Confirmar Nova Senha">
                    </div>
                </div>

                <button type="submit" class="w-full bg-blue-600 text-white p-3 rounded-md font-semibold hover:bg-blue-700 transition duration-200">
                    Salvar Alterações
                </button>
            </form>
        </div>
    </div>

    <script>
        const CURRENT_USER_ID = 1;
        const API_URL = 'http://localhost:8080';

        async function loadProfile() {
            try {
                // Simulando busca de perfil. Em sistema real, endpoint /users/{id}
                const response = await fetch(`${API_URL}/routes/user/${CURRENT_USER_ID}`); // Apenas para validar conexão
                if(response.ok) {
                    document.getElementById('userName').value = "Usuário Exemplo";
                    document.getElementById('userEmail').value = "usuario@exemplo.com";
                    document.getElementById('userCpf').value = "123.456.789-00";
                    document.getElementById('userPhone').value = "(11) 99999-9999";
                }
            } catch (e) { console.error("Erro ao carregar perfil"); }
        }

        document.getElementById('profileForm').addEventListener('submit', (e) => {
            e.preventDefault();
            alert('Perfil atualizado com sucesso! (Implemente o endpoint PUT /users/{id} no backend para salvar)');
        });

        function logout() { window.location.href = 'index.html'; }
        window.onload = loadProfile;
    </script>
</body>
</html>
