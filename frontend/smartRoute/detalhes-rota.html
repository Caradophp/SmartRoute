<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartRoute - Detalhes da Rota</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 min-h-screen">
    <nav class="bg-blue-600 text-white p-4 shadow-md">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold"><i class="fas fa-route mr-2"></i>SmartRoute</h1>
            <a href="rotas.html" class="hover:underline"><i class="fas fa-arrow-left mr-1"></i> Voltar</a>
        </div>
    </nav>

    <div class="container mx-auto p-6 max-w-4xl">
        <div class="bg-white rounded-lg shadow-lg overflow-hidden">
            <!-- Simulação de Mapa -->
            <div class="bg-blue-200 h-80 w-full relative flex items-center justify-center text-blue-500">
                <div class="text-center">
                    <i class="fas fa-map-marked-alt text-6xl mb-2"></i>
                    <p class="font-medium italic">Integração com Google Maps / Leaflet aqui</p>
                </div>
                <div class="absolute top-4 right-4 bg-white p-2 rounded shadow text-gray-800 text-xs font-bold">
                    Modo de Visualização: Satélite
                </div>
            </div>

            <div class="p-8">
                <div class="flex justify-between items-start mb-6">
                    <div>
                        <h2 id="routeName" class="text-3xl font-bold text-gray-800">Nome da Rota</h2>
                        <p class="text-gray-500">ID da Rota: #<span id="routeId">0</span></p>
                    </div>
                    <div class="bg-blue-100 text-blue-700 px-4 py-2 rounded-full font-bold">
                        <i class="fas fa-road mr-2"></i> <span id="routeDist">0</span> km
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-8 mb-8">
                    <div class="flex items-center p-4 bg-gray-50 rounded-lg border-l-4 border-red-500">
                        <i class="fas fa-map-marker-alt text-red-500 text-2xl mr-4"></i>
                        <div>
                            <p class="text-xs text-gray-500 uppercase font-bold">Origem</p>
                            <p id="routeOrigin" class="text-lg font-medium text-gray-800">Endereço de Origem</p>
                        </div>
                    </div>
                    <div class="flex items-center p-4 bg-gray-50 rounded-lg border-l-4 border-green-500">
                        <i class="fas fa-flag-checkered text-green-500 text-2xl mr-4"></i>
                        <div>
                            <p class="text-xs text-gray-500 uppercase font-bold">Destino</p>
                            <p id="routeDestination" class="text-lg font-medium text-gray-800">Endereço de Destino</p>
                        </div>
                    </div>
                </div>

                <div class="flex space-x-4">
                    <button class="flex-1 bg-blue-600 text-white p-3 rounded-md font-bold hover:bg-blue-700 transition">
                        <i class="fas fa-play mr-2"></i> Iniciar Navegação
                    </button>
                    <button onclick="window.location.href='rotas.html'" class="px-6 py-3 border border-gray-300 rounded-md font-semibold hover:bg-gray-50 transition">
                        Voltar
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        async function loadRouteDetails() {
            const params = new URLSearchParams(window.location.search);
            const id = params.get('id');
            if(!id) { alert("ID da rota não fornecido!"); return; }

            try {
                const response = await fetch(`http://localhost:8080/routes/${id}`);
                const route = await response.json();

                document.getElementById('routeName').innerText = route.name;
                document.getElementById('routeId').innerText = route.id;
                document.getElementById('routeDist').innerText = route.distance || "N/A";
                document.getElementById('routeOrigin').innerText = route.origin;
                document.getElementById('routeDestination').innerText = route.destination;
            } catch (e) {
                console.error("Erro ao carregar detalhes");
            }
        }
        window.onload = loadRouteDetails;
    </script>
</body>
</html>
