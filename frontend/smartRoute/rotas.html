<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartRoute - Minhas Rotas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 min-h-screen">

    <!-- Navbar -->
    <nav class="bg-blue-600 text-white p-4 shadow-md">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold"><i class="fas fa-route mr-2"></i>SmartRoute</h1>
            <div class="space-x-4">
                <a href="index.html" class="hover:underline">Login</a>
                <button onclick="logout()" class="bg-blue-700 px-3 py-1 rounded hover:bg-blue-800 transition">Sair</button>
            </div>
        </div>
    </nav>

    <div class="container mx-auto p-6 grid grid-cols-1 lg:grid-cols-3 gap-6">

        <!-- Coluna Esquerda: Formulário de Nova Rota -->
        <div class="lg:col-span-1">
            <div class="bg-white p-6 rounded-lg shadow-md">
                <h2 id="formTitle" class="text-lg font-semibold mb-4 text-gray-700 border-b pb-2">
                    <i class="fas fa-plus-circle mr-2 text-blue-600"></i>Nova Rota
                </h2>
                <form id="routeForm" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-600">Nome da Rota</label>
                        <input type="text" id="routeName" required class="w-full p-2 border rounded-md focus:ring-blue-500 focus:border-blue-500" placeholder="Ex: Trabalho -> Casa">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-600">Origem</label>
                        <input type="text" id="routeOrigin" required class="w-full p-2 border rounded-md focus:ring-blue-500 focus:border-blue-500" placeholder="Cidade ou Rua">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-600">Destino</label>
                        <input type="text" id="routeDestination" required class="w-full p-2 border rounded-md focus:ring-blue-500 focus:border-blue-500" placeholder="Cidade ou Rua">
                    </div>
                    <button type="submit" id="submitBtn" class="w-full bg-blue-600 text-white p-2 rounded-md font-semibold hover:bg-blue-700 transition duration-200">
                        Salvar Rota
                    </button>
                    <button type="button" id="cancelBtn" onclick="cancelEdit()" class="hidden w-full bg-gray-400 text-white p-2 rounded-md font-semibold hover:bg-gray-500 transition duration-200 mt-2">
                        Cancelar Edição
                    </button>
                </form>
            </div>
        </div>

        <!-- Coluna Direita: Listagem de Rotas -->
        <div class="lg:col-span-2">
            <div class="bg-white p-6 rounded-lg shadow-md">
                <h2 class="text-lg font-semibold mb-4 text-gray-700 border-b pb-2">
                    <i class="fas fa-list mr-2 text-blue-600"></i>Minhas Rotas Salvas
                </h2>
                <div id="routesList" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <p class="text-gray-400 italic col-span-full text-center py-10">Nenhuma rota encontrada. Crie a sua primeira rota!</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        const CURRENT_USER_ID = 1;
        const API_URL = 'http://localhost:8080';
        let routesData = [];
        let editId = null;

        async function loadRoutes() {
            try {
                const response = await fetch(`${API_URL}/routes/user/${CURRENT_USER_ID}`);
                routesData = await response.json();

                const listContainer = document.getElementById('routesList');

                if (routesData.length === 0) {
                    listContainer.innerHTML = '<p class="text-gray-400 italic col-span-full text-center py-10">Nenhuma rota encontrada.</p>';
                    return;
                }

                listContainer.innerHTML = '';
                routesData.forEach(route => {
                    listContainer.innerHTML += `
                        <div class="border p-4 rounded-lg hover:border-blue-400 transition bg-gray-50 relative group">
                            <h3 class="font-bold text-blue-700">${route.name}</h3>
                            <p class="text-sm text-gray-600"><i class="fas fa-map-marker-alt text-red-500 mr-1"></i> <strong class="text-gray-800">De:</strong> ${route.origin}</p>
                            <p class="text-sm text-gray-600"><i class="fas fa-flag-checkered text-green-500 mr-1"></i> <strong class="text-gray-800">Para:</strong> ${route.destination}</p>
                            <div class="mt-3 flex justify-between items-center">
                                <span class="text-xs font-medium text-gray-400">ID: #${route.id}</span>
                                <div class="flex space-x-2 opacity-0 group-hover:opacity-100 transition">
                                    <button onclick="startEdit(${route.id})" class="text-blue-500 hover:text-blue-700 text-xs font-semibold">
                                        <i class="fas fa-edit"></i> Editar
                                    </button>
                                    <button onclick="deleteRoute(${route.id})" class="text-red-500 hover:text-red-700 text-xs font-semibold">
                                        <i class="fas fa-trash"></i> Excluir
                                    </button>
                                </div>
                            </div>
                        </div>
                    `;
                });
            } catch (error) {
                console.error('Erro ao carregar rotas:', error);
            }
        }

        function startEdit(id) {
            const route = routesData.find(r => r.id === id);
            if (!route) return;

            editId = id;
            document.getElementById('routeName').value = route.name;
            document.getElementById('routeOrigin').value = route.origin;
            document.getElementById('routeDestination').value = route.destination;

            document.getElementById('formTitle').innerHTML = '<i class="fas fa-edit mr-2 text-green-600"></i>Editar Rota';
            document.getElementById('submitBtn').innerText = 'Atualizar Rota';
            document.getElementById('submitBtn').classList.replace('bg-blue-600', 'bg-green-600');
            document.getElementById('cancelBtn').classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function cancelEdit() {
            editId = null;
            document.getElementById('routeForm').reset();
            document.getElementById('formTitle').innerHTML = '<i class="fas fa-plus-circle mr-2 text-blue-600"></i>Nova Rota';
            document.getElementById('submitBtn').innerText = 'Salvar Rota';
            document.getElementById('submitBtn').classList.replace('bg-green-600', 'bg-blue-600');
            document.getElementById('cancelBtn').classList.add('hidden');
        }

        document.getElementById('routeForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const routeData = {
                name: document.getElementById('routeName').value,
                origin: document.getElementById('routeOrigin').value,
                destination: document.getElementById('routeDestination').value,
                user: { id: CURRENT_USER_ID }
            };

            try {
                const url = editId ? `${API_URL}/routes/${editId}` : `${API_URL}/routes`;
                const method = editId ? 'PUT' : 'POST';

                const response = await fetch(url, {
                    method: method,
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(routeData)
                });

                if (response.ok) {
                    alert(editId ? 'Rota atualizada com sucesso!' : 'Rota salva com sucesso!');
                    cancelEdit();
                    loadRoutes();
                } else {
                    alert('Erro ao salvar rota.');
                }
            } catch (error) {
                alert('Erro de conexão com o servidor.');
            }
        });

        async function deleteRoute(id) {
            if (confirm('Tem certeza que deseja excluir esta rota?')) {
                try {
                    const response = await fetch(`${API_URL}/routes/${id}`, { method: 'DELETE' });
                    if (response.ok) {
                        loadRoutes();
                    } else {
                        alert('Erro ao excluir rota.');
                    }
                } catch (error) {
                    alert('Erro de conexão.');
                }
            }
        }

        function logout() {
            window.location.href = 'index.html';
        }

        window.onload = loadRoutes;
    </script>
</body>
</html>
